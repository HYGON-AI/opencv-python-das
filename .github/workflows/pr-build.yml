name: PR build
run-name: "PR build - #${{ github.event.pull_request.number }}"

# Install this trusted workflow on the default branch.
# Require "PR build result" in branch protection.
on:
  pull_request_target:
    branches: [4.9.0]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Unrelated labels use a separate group and cannot replace a pending build.
  group: >-
    opencv-python-das-pr-build-${{ github.event.pull_request.number }}-${{
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'ready-build' && github.run_id || 'build'
    }}
  cancel-in-progress: true

env:
  DTK_PKG_URL: ${{ vars.RESOURCE_SERVER_URL }}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
  PYPI_URL: ${{ vars.PYPI_URL }}
  MAX_JOBS: "32"

jobs:
  authorize-pr:
    name: Authorize self-hosted build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
    steps:
      - uses: actions/github-script@v7
        id: authorization
        with:
          script: |
            const label = "ready-build";
            const action = context.payload.action;
            const expected = context.payload.pull_request;
            const labelEvent = ["labeled", "unlabeled"].includes(action);
            const reset = ["opened", "synchronize", "reopened", "ready_for_review"];
            core.setOutput("authorized", "false");
            if (labelEvent && context.payload.label?.name !== label) return;
            if (!labelEvent && !reset.includes(action)) {
              core.setFailed("Unsupported PR action: " + action);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: expected.number,
            });
            if (pr.state !== "open" || pr.base.ref !== "4.9.0" || !pr.head.repo ||
                pr.head.sha !== expected.head.sha || pr.base.sha !== expected.base.sha) {
              core.setFailed("PR state/head/base changed. Trigger a fresh authorization.");
              return;
            }
            const repo = context.repo.owner + "/" + context.repo.repo;
            if (pr.head.repo.full_name.toLowerCase() === repo.toLowerCase()) {
              core.setOutput("authorized", "true");
              return;
            }
            if (reset.includes(action)) {
              if (pr.labels.some(item => item.name === label)) {
                try {
                  await github.rest.issues.removeLabel({
                    ...context.repo, issue_number: pr.number, name: label,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              core.setFailed("Fork revision " + pr.head.sha + " requires a maintainer to apply ready-build.");
              return;
            }
            if (action === "unlabeled" || !pr.labels.some(item => item.name === label)) {
              core.setFailed("Fork build authorization was removed.");
              return;
            }
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.actor,
            });
            if (!["write", "maintain", "admin"].includes(data.permission)) {
              core.setFailed(context.actor + " cannot authorize this build.");
              return;
            }
            core.info(context.actor + " authorized " + pr.head.sha);
            core.setOutput("authorized", "true");

  build-wheel:
    name: Build and test manylinux wheel
    needs: authorize-pr
    if: needs.authorize-pr.outputs.authorized == 'true'
    runs-on: self-hosted
    timeout-minutes: 240
    container:
      image: ${{ vars.BASE_COMPILE_IMAGE_ROCKY_PY310 }}
      options: >-
        --device=/dev/kfd
        --device=/dev/dri/
        --group-add video
        -v /opt/hyhal/:/opt/hyhal/:ro
        --shm-size=80G

    steps:
      - name: Checkout base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          submodules: false
          fetch-depth: 0
          persist-credentials: false

      - name: Merge authorized PR revision
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\r\n')"
          echo "::add-mask::${auth}"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags \
            --no-recurse-submodules origin "+refs/pull/${PR_NUMBER}/head"
          if ! git cat-file -e "${HEAD_SHA}^{commit}"; then
            git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
              fetch --no-tags --no-recurse-submodules origin "${HEAD_SHA}"
          fi
          unset auth GH_TOKEN
          git -c user.name='PR build' -c user.email='pr-build@localhost' \
            merge --no-ff --no-edit "${HEAD_SHA}"
          echo "base=${BASE_SHA} head=${HEAD_SHA} integration=$(git rev-parse HEAD)"

      # Submodules and LFS objects must be anonymously readable.
      - name: Checkout submodules
        shell: bash
        run: |
          set -euo pipefail
          required_submodules=(opencv opencv_contrib opencv_extra)

          if ! command -v git-lfs >/dev/null 2>&1; then
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y git-lfs
            elif command -v yum >/dev/null 2>&1; then
              yum install -y git-lfs
            else
              echo 'git-lfs is required to download OpenCV test data' >&2
              exit 1
            fi
          fi

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          for submodule in opencv opencv_contrib opencv_extra; do
            git config --global --add safe.directory "${GITHUB_WORKSPACE}/${submodule}"
          done

          # Self-hosted runners keep the workspace between jobs. A previously
          # interrupted clone can leave a registered submodule without HEAD,
          # which makes every subsequent update fail with "Needed a single
          # revision". Remove only these generated checkout directories and
          # their Git metadata before initializing the pinned revisions.
          git submodule deinit --force -- "${required_submodules[@]}" || true
          for submodule in "${required_submodules[@]}"; do
            rm -rf -- "${submodule}" ".git/modules/${submodule}"
          done

          git submodule sync -- "${required_submodules[@]}"
          for attempt in 1 2 3; do
            if git \
              -c http.version=HTTP/1.1 \
              -c http.maxRequests=1 \
              submodule update --init --force --recursive --depth 1 --jobs 1 -- \
              "${required_submodules[@]}"; then
              break
            fi
            if [[ "${attempt}" == 3 ]]; then
              echo "Failed to initialize required OpenCV submodules" >&2
              exit 1
            fi
            sleep "$((attempt * 15))"
          done

          git -C opencv_extra lfs install --local
          git -C opencv_extra lfs pull --include='testdata/**'

          # A wheel MR validates the current source repositories, not stale
          # gitlink commits recorded in opencv-python-das. Keep the test-data
          # submodule pinned, but consume the latest 4.9.0 tip of both source
          # repositories for this build and print the exact SHAs used.
          for submodule in opencv opencv_contrib; do
            for attempt in 1 2 3; do
              if git -C "${submodule}" \
                -c http.version=HTTP/1.1 \
                -c http.maxRequests=1 \
                fetch --depth 1 origin 4.9.0 && \
                git -C "${submodule}" checkout --detach FETCH_HEAD; then
                break
              fi
              [[ "${attempt}" == 3 ]] && {
                echo "Failed to fetch latest 4.9.0 tip for ${submodule}" >&2
                exit 1
              }
              sleep "$((attempt * 15))"
            done
            echo "${submodule}: $(git -C "${submodule}" rev-parse HEAD)"
          done

      - name: Configure Python package index
        shell: bash
        run: |
          set -euo pipefail
          index_url="${PYPI_URL}/nightly/dtk2604/+simple/"
          trusted_host="${index_url#*://}"
          trusted_host="${trusted_host%%/*}"
          echo "PIP_INDEX_URL=${index_url}" >> "${GITHUB_ENV}"
          echo "PIP_TRUSTED_HOST=${trusted_host}" >> "${GITHUB_ENV}"

      - name: Install build dependencies
        shell: bash
        env:
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
        run: bash .github/scripts/install_dependencies.sh

      - name: Build wheel
        shell: bash
        run: bash .github/scripts/build_wheel.sh

      - name: Repair manylinux wheel
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/manylinux_repair.sh dist dist-manylinux
          rm -rf -- wheelhouse
          mkdir -p wheelhouse
          cp -v dist-manylinux/*.whl wheelhouse/
          compgen -G 'wheelhouse/*.whl' >/dev/null
          cd wheelhouse
          sha256sum ./*.whl > SHA256SUMS

      - name: Test repaired wheel
        shell: bash
        run: bash .github/scripts/test_wheel.sh wheelhouse

  ci-result:
    name: >-
      ${{
        (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        github.event.label.name != 'ready-build' &&
        'Ignored label event' || 'PR build result'
      }}
    needs: [authorize-pr, build-wheel]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject cancelled runs
        if: cancelled()
        run: exit 1
      - uses: actions/github-script@v7
        env:
          AUTH_RESULT: ${{ needs.authorize-pr.result }}
          AUTHORIZED: ${{ needs.authorize-pr.outputs.authorized }}
          BUILD_RESULT: ${{ needs.build-wheel.result }}
        with:
          script: |
            const action = context.payload.action;
            if (["labeled", "unlabeled"].includes(action) &&
                context.payload.label?.name !== "ready-build") return;
            if (process.env.AUTH_RESULT !== "success" ||
                process.env.AUTHORIZED !== "true" || process.env.BUILD_RESULT !== "success") {
              core.setFailed("An authorized build and all wheel tests must succeed.");
              return;
            }
            const expected = context.payload.pull_request;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: expected.number,
            });
            const repo = context.repo.owner + "/" + context.repo.repo;
            const sameRepo = pr.head.repo?.full_name.toLowerCase() === repo.toLowerCase();
            if (pr.state !== "open" || pr.base.ref !== "4.9.0" || !pr.head.repo ||
                pr.head.sha !== expected.head.sha || pr.base.sha !== expected.base.sha ||
                (!sameRepo && !pr.labels.some(item => item.name === "ready-build"))) {
              core.setFailed("PR state/head/base or authorization changed. A fresh build is required.");
            }
